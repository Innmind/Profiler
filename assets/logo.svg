<svg height="50" width="50" style="zoom: 10%" xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink">
  <circle cx="25" cy="25" r="25" fill="rgb(48,48,48)" />
  <defs>
    <g id="leaf" filter="url(#shadow)">
      <path d="m 25 2 q -6 12 0 15" fill="white" />
      <path d="m 25 2 q 6 12 0 15" fill="white" />
      <polygon points="25,8 25,17 24,17" fill="rgb(48,48,48)" />
    </g>
    <filter id="shadow" x="0" y="0" width="100%" height="120%">
      <feOffset result="offOut" in="SourceAlpha" dx="0" dy="5" />
      <feGaussianBlur result="blurOut" in="offOut" stdDeviation="10" />
      <feBlend in="SourceGraphic" in2="offOut" mode="normal" />
    </filter>
  </defs>
  <use xlink:href="#leaf" />
  <use xlink:href="#leaf" transform="rotate(45 25 25)" />
  <use xlink:href="#leaf" transform="rotate(90 25 25)" />
  <use xlink:href="#leaf" transform="rotate(135 25 25)" />
  <use xlink:href="#leaf" transform="rotate(180 25 25)" />
  <use xlink:href="#leaf" transform="rotate(225 25 25)" />
  <use xlink:href="#leaf" transform="rotate(270 25 25)" />
  <use xlink:href="#leaf" transform="rotate(315 25 25)" />
  <circle cx="25" cy="25" r="6" stroke="rgb(52,140,255)" stroke-width="1" fill="none" />
</svg>
